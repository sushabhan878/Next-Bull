version: '3.8'

services:
  # 1. The Primary Database (Users, Rules, Settings)
  postgres-primary:
    image: postgres:15-alpine
    container_name: ats_primary_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: alerts_core_db
      # This pulls the password directly from your local .env file!
      POSTGRES_PASSWORD: ${PRIMARY_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data

  # 2. The Candlestick/Market Data Database (TimescaleDB)
  timescaledb:
    # Timescale provides an official image built on top of Postgres
    image: timescale/timescaledb:latest-pg15
    container_name: ats_candlestick_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: market_data_db
      POSTGRES_PASSWORD: ${CANDLESTICK_DB_PASSWORD}
    ports:
      # Notice this maps your computer's port 5433 to the container's 5432.
      # This prevents it from clashing with the primary Postgres DB above!
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  # 3. Redis (For fast caching and Pub/Sub websocket streams)
  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: always
    # We pass the password as a command-line argument to the Redis server
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

# Volumes ensure your data survives even if you delete the containers
volumes:
  postgres_primary_data:
  timescaledb_data:
  redis_data: