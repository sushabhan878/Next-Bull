version: '3.8'

services:
  # -------------------------------------
  # 1. FRONTEND (React / Vite)
  # -------------------------------------
  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        # NOTE: For local VM testing, this can be your VM's IP address
        # E.g., http://198.51.100.23:8080/v1
        - VITE_API_BASE_URL=http://localhost:8080/v1
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  # -------------------------------------
  # 2. BACKEND (Go)
  # -------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Viper overrides! We replace 'localhost' with the service names below.
      # We also use the internal Docker ports (5432) instead of the mapped host ports.
      - PRIMARY_DB_HOST=postgres-primary
      - PRIMARY_DB_PORT=5432 
      - CANDLESTICK_DB_HOST=timescaledb
      - CANDLESTICK_DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Pass through the secrets from your VM's .env file
      - PRIMARY_DB_PASSWORD=${PRIMARY_DB_PASSWORD}
      - CANDLESTICK_DB_PASSWORD=${CANDLESTICK_DB_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SERVER_JWT_SECRET=${SERVER_JWT_SECRET}
      - SERVER_JWT_REFRESH_SECRET=${SERVER_JWT_REFRESH_SECRET}
    depends_on:
      - postgres-primary
      - timescaledb
      - redis
    restart: unless-stopped

  # -------------------------------------
  # 3. INFRASTRUCTURE (From your file)
  # -------------------------------------
  postgres-primary:
    image: postgres:15-alpine
    container_name: ats_primary_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: alerts_core_db
      POSTGRES_PASSWORD: ${PRIMARY_DB_PASSWORD}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    # Removed the port mapping (5434:5432) so it is only accessible internally

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: ats_candlestick_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: market_data_db
      POSTGRES_PASSWORD: ${CANDLESTICK_DB_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # Removed the port mapping (5433:5432) so it is only accessible internally

  redis:
    image: redis:7-alpine
    container_name: ats_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Removed the port mapping (6379:6379) so it is only accessible internally

volumes:
  postgres_primary_data:
  timescaledb_data:
  redis_data: